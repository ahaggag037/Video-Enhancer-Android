name: Build NanoVSR LR Temporal-Core APK

on:
  push:
    branches: [ feature/v3-temporal-restoration-rd ]
    paths:
      - '.github/workflows/nanovsr-android-benchmark-apk.yml'
      - 'diagnostics/nanovsr/**'
      - 'app/src/main/java/com/haggag/videoenhancer/NanoVsrBenchmarkActivity.kt'
      - 'app/src/main/java/com/haggag/videoenhancer/NanoVsrDeviceBenchmark.kt'
      - 'app/src/main/java/com/haggag/videoenhancer/LiteRtModelRunner.kt'
      - 'app/src/main/res/layout/activity_nanovsr_benchmark.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lr-core-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android 36 SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install CPU PyTorch and LiteRT converter
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install 'litert-torch==0.9.4' 'ai-edge-litert' numpy

      - name: Fetch NanoVSR checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/filippawlicki/nanovsr.git /tmp/nanovsr
          curl -L --fail --retry 3 --retry-delay 2 \
            https://github.com/filippawlicki/nanovsr/releases/download/v1.0/nanovsr_226k.pth \
            -o /tmp/nanovsr/nanovsr_226k.pth
          echo 'be3df12f2a0d99d9699656aa4a85a51c119663aa84c7040ac6580a0215d0b00e  /tmp/nanovsr/nanovsr_226k.pth' | sha256sum -c -

      - name: Build LR temporal-core models and parity probes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          import os
          import sys
          import torch
          import torch.nn as nn
          import litert_torch

          torch.manual_seed(20261021)
          out_dir = 'app/src/main/assets'
          os.makedirs(out_dir, exist_ok=True)

          sys.path.insert(0, '/tmp/nanovsr')
          from models.nanovsr import NanoVSR

          checkpoint = torch.load('/tmp/nanovsr/nanovsr_226k.pth', map_location='cpu')
          if isinstance(checkpoint, dict):
              for key in ('params_ema', 'params', 'model_state_dict'):
                  if key in checkpoint:
                      checkpoint = checkpoint[key]
                      break

          num_feat = int(checkpoint['feat_extract.rbr_dense.0.weight'].shape[0])
          indices = {
              int(key.split('.')[1])
              for key in checkpoint
              if key.startswith('forward_net.') and key.split('.')[1].isdigit()
          }
          num_blocks = max(indices) + 1
          upstream = NanoVSR(num_feat=num_feat, num_blocks=num_blocks)
          upstream.load_state_dict(checkpoint, strict=True)
          upstream.switch_to_deploy()
          upstream.eval()

          class BidirCenterCore(nn.Module):
              """Exact NanoVSR temporal recurrence/fusion, no x4 neural reconstruction head."""
              def __init__(self, model):
                  super().__init__()
                  self.feat_extract = model.feat_extract
                  self.forward_net = model.forward_net
                  self.backward_net = model.backward_net
                  self.fusion = model.fusion

              def forward(self, x0, x1, x2, x3, x4):
                  f0 = self.feat_extract(x0)
                  f1 = self.feat_extract(x1)
                  f2 = self.feat_extract(x2)
                  f3 = self.feat_extract(x3)
                  f4 = self.feat_extract(x4)

                  p0 = self.forward_net(f0)
                  p1 = self.forward_net(f1 + p0)
                  p2 = self.forward_net(f2 + p1)

                  b4 = self.backward_net(f4)
                  b3 = self.backward_net(f3 + b4)
                  b2 = self.backward_net(f2 + b3)

                  return self.fusion(torch.cat((p2, b2), dim=1))

          class StreamingForwardCore(nn.Module):
              """One-frame exact forward recurrence from NanoVSR with explicit hidden state."""
              def __init__(self, model):
                  super().__init__()
                  self.feat_extract = model.feat_extract
                  self.forward_net = model.forward_net

              def forward(self, frame, previous_state):
                  feat = self.feat_extract(frame)
                  return self.forward_net(feat + previous_state)

          def export(name, model, inputs):
              model.eval()
              edge = litert_torch.convert(model, inputs)
              path = os.path.join(out_dir, name)
              edge.export(path)
              print(path, os.path.getsize(path))

          # Exact-equivalence gate for the computations we keep from upstream.
          h, w = 24, 32
          frames = tuple(torch.rand(1, 3, h, w) for _ in range(5))
          state = torch.rand(1, num_feat, h, w)
          bidir = BidirCenterCore(copy.deepcopy(upstream)).eval()
          stream = StreamingForwardCore(copy.deepcopy(upstream)).eval()

          with torch.no_grad():
              f = [upstream.feat_extract(x) for x in frames]
              p0 = upstream.forward_net(f[0])
              p1 = upstream.forward_net(f[1] + p0)
              p2 = upstream.forward_net(f[2] + p1)
              b4 = upstream.backward_net(f[4])
              b3 = upstream.backward_net(f[3] + b4)
              b2 = upstream.backward_net(f[2] + b3)
              ref_bidir = upstream.fusion(torch.cat((p2, b2), dim=1))
              got_bidir = bidir(*frames)

              ref_stream = upstream.forward_net(upstream.feat_extract(frames[0]) + state)
              got_stream = stream(frames[0], state)

          bidir_max = float((ref_bidir - got_bidir).abs().max())
          stream_max = float((ref_stream - got_stream).abs().max())
          if bidir_max > 1e-6 or stream_max > 1e-6:
              raise RuntimeError(f'LR core parity failed: bidir={bidir_max} stream={stream_max}')

          report = {
              'upstream': 'NanoVSR-226k v1.0',
              'num_feat': num_feat,
              'num_blocks': num_blocks,
              'bidir_center_max_abs_error': bidir_max,
              'stream_forward_max_abs_error': stream_max,
              'removed_for_probe': ['upsample1', 'upsample2', 'conv_last', 'x4 bilinear residual base'],
              'purpose': 'measure LR temporal brain cost before designing a lightweight reconstruction head',
          }
          with open('/tmp/nanovsr_lr_core_report.json', 'w') as f:
              json.dump(report, f, indent=2)
          print(json.dumps(report, indent=2))

          for h, w in ((96, 160), (180, 320)):
              frames = tuple(torch.zeros(1, 3, h, w, dtype=torch.float32) for _ in range(5))
              export(
                  f'nanovsr_core_bidir_t5_{h}x{w}.tflite',
                  BidirCenterCore(copy.deepcopy(upstream)),
                  frames,
              )
              export(
                  f'nanovsr_core_stream_{h}x{w}.tflite',
                  StreamingForwardCore(copy.deepcopy(upstream)),
                  (
                      torch.zeros(1, 3, h, w, dtype=torch.float32),
                      torch.zeros(1, num_feat, h, w, dtype=torch.float32),
                  ),
              )
          PY

          sha256sum app/src/main/assets/nanovsr_core_*.tflite | tee /tmp/lr_core_models.sha256

      - name: Switch build to standalone LR-core package
        shell: bash
        run: |
          set -euo pipefail
          cp diagnostics/nanovsr/AndroidManifest.xml app/src/main/AndroidManifest.xml
          sed -i 's/applicationId = "com.haggag.videoenhancer"/applicationId = "com.haggag.videoenhancer.lrcore"/' app/build.gradle.kts
          sed -i 's/versionName = "2.0.0-ai"/versionName = "3.0.4-lr-core"/' app/build.gradle.kts

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build diagnostic APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify diagnostic APK contains LR-core models
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          for asset in \
            nanovsr_core_bidir_t5_96x160.tflite \
            nanovsr_core_bidir_t5_180x320.tflite \
            nanovsr_core_stream_96x160.tflite \
            nanovsr_core_stream_180x320.tflite; do
              unzip -l "$APK" | grep -F "assets/$asset"
          done
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee /tmp/temporal_ai_lr_core_apk.sha256

      - name: Upload NanoVSR LR Temporal-Core APK
        uses: actions/upload-artifact@v4
        with:
          name: Temporal-AI-NanoVSR-LR-Core
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            /tmp/nanovsr_lr_core_report.json
            /tmp/lr_core_models.sha256
            /tmp/temporal_ai_lr_core_apk.sha256
          if-no-files-found: error
