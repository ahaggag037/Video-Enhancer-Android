name: Build Temporal AI GPU Isolation APK

on:
  push:
    branches: [ feature/v3-temporal-restoration-rd ]
    paths:
      - '.github/workflows/nanovsr-android-benchmark-apk.yml'
      - 'diagnostics/nanovsr/**'
      - 'app/src/main/java/com/haggag/videoenhancer/NanoVsrBenchmarkActivity.kt'
      - 'app/src/main/java/com/haggag/videoenhancer/NanoVsrDeviceBenchmark.kt'
      - 'app/src/main/java/com/haggag/videoenhancer/LiteRtModelRunner.kt'
      - 'app/src/main/res/layout/activity_nanovsr_benchmark.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gpu-isolation-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android 36 SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install CPU PyTorch and LiteRT converter
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install 'litert-torch==0.9.4' 'ai-edge-litert' numpy

      - name: Build GPU isolation models
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/filippawlicki/nanovsr.git /tmp/nanovsr
          curl -L --fail --retry 3 --retry-delay 2 \
            https://github.com/filippawlicki/nanovsr/releases/download/v1.0/nanovsr_226k.pth \
            -o /tmp/nanovsr/nanovsr_226k.pth
          echo 'be3df12f2a0d99d9699656aa4a85a51c119663aa84c7040ac6580a0215d0b00e  /tmp/nanovsr/nanovsr_226k.pth' | sha256sum -c -

          python - <<'PY'
          import os
          import sys
          import torch
          import torch.nn as nn
          import torch.nn.functional as F
          import litert_torch

          torch.manual_seed(20261021)
          out_dir = 'app/src/main/assets'
          os.makedirs(out_dir, exist_ok=True)

          def export(name, model, sample):
              model.eval()
              edge = litert_torch.convert(model, (sample,))
              path = os.path.join(out_dir, name)
              edge.export(path)
              print(name, os.path.getsize(path))

          class ConvLeaky(nn.Module):
              def __init__(self):
                  super().__init__()
                  self.conv = nn.Conv2d(3, 8, 3, padding=1)
              def forward(self, x):
                  return F.leaky_relu(self.conv(x), negative_slope=0.1)

          class PreluProbe(nn.Module):
              def __init__(self):
                  super().__init__()
                  self.prelu = nn.PReLU(num_parameters=3)
              def forward(self, x):
                  return self.prelu(x)

          class PixelShuffleProbe(nn.Module):
              def __init__(self):
                  super().__init__()
                  self.conv = nn.Conv2d(3, 12, 3, padding=1)
                  self.shuffle = nn.PixelShuffle(2)
              def forward(self, x):
                  return self.shuffle(self.conv(x))

          class ResizeProbe(nn.Module):
              def forward(self, x):
                  return F.interpolate(x, scale_factor=4.0, mode='bilinear', align_corners=False)

          class ConcatProbe(nn.Module):
              def __init__(self):
                  super().__init__()
                  self.fuse = nn.Conv2d(6, 3, 1)
              def forward(self, x):
                  return self.fuse(torch.cat((x, x), dim=1))

          class Rank5TemporalGatherProbe(nn.Module):
              def __init__(self):
                  super().__init__()
                  self.fuse = nn.Conv2d(6, 3, 1)
              def forward(self, x):
                  a = x[:, 0, :, :, :]
                  b = x[:, 1, :, :, :]
                  return self.fuse(torch.cat((a, b), dim=1))

          export('probe_conv_leaky.tflite', ConvLeaky(), torch.zeros(1, 3, 64, 64))
          export('probe_prelu.tflite', PreluProbe(), torch.zeros(1, 3, 64, 64))
          export('probe_pixelshuffle.tflite', PixelShuffleProbe(), torch.zeros(1, 3, 64, 64))
          export('probe_resize.tflite', ResizeProbe(), torch.zeros(1, 3, 32, 32))
          export('probe_concat.tflite', ConcatProbe(), torch.zeros(1, 3, 64, 64))
          export('probe_rank5_gather.tflite', Rank5TemporalGatherProbe(), torch.zeros(1, 5, 3, 32, 32))

          sys.path.insert(0, '/tmp/nanovsr')
          from models.nanovsr import NanoVSR

          checkpoint = torch.load('/tmp/nanovsr/nanovsr_226k.pth', map_location='cpu')
          if isinstance(checkpoint, dict):
              for key in ('params_ema', 'params', 'model_state_dict'):
                  if key in checkpoint:
                      checkpoint = checkpoint[key]
                      break

          num_feat = int(checkpoint['feat_extract.rbr_dense.0.weight'].shape[0])
          indices = {
              int(key.split('.')[1])
              for key in checkpoint
              if key.startswith('forward_net.') and key.split('.')[1].isdigit()
          }
          num_blocks = max(indices) + 1
          model = NanoVSR(num_feat=num_feat, num_blocks=num_blocks)
          model.load_state_dict(checkpoint, strict=True)
          model.switch_to_deploy()
          model.eval()

          for h, w in ((32, 32), (64, 64), (96, 160), (180, 320)):
              export(
                  f'nanovsr_226k_t5_{h}x{w}.tflite',
                  model,
                  torch.zeros(1, 5, 3, h, w, dtype=torch.float32),
              )
          PY

          sha256sum app/src/main/assets/probe_*.tflite app/src/main/assets/nanovsr_226k_t5_*.tflite | tee /tmp/gpu_isolation_models.sha256

      - name: Switch build to standalone GPU isolation package
        shell: bash
        run: |
          set -euo pipefail
          cp diagnostics/nanovsr/AndroidManifest.xml app/src/main/AndroidManifest.xml
          sed -i 's/applicationId = "com.haggag.videoenhancer"/applicationId = "com.haggag.videoenhancer.gpuisolation"/' app/build.gradle.kts
          sed -i 's/versionName = "2.0.0-ai"/versionName = "3.0.1-gpu-isolation"/' app/build.gradle.kts

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build diagnostic APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify diagnostic APK contains all probes
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          for asset in \
            probe_conv_leaky.tflite \
            probe_prelu.tflite \
            probe_pixelshuffle.tflite \
            probe_resize.tflite \
            probe_concat.tflite \
            probe_rank5_gather.tflite \
            nanovsr_226k_t5_32x32.tflite \
            nanovsr_226k_t5_64x64.tflite \
            nanovsr_226k_t5_96x160.tflite \
            nanovsr_226k_t5_180x320.tflite; do
              unzip -l "$APK" | grep -F "assets/$asset"
          done
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee /tmp/temporal_ai_gpu_isolation_apk.sha256

      - name: Upload Temporal AI GPU Isolation APK
        uses: actions/upload-artifact@v4
        with:
          name: Temporal-AI-GPU-Isolation-Android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            /tmp/gpu_isolation_models.sha256
            /tmp/temporal_ai_gpu_isolation_apk.sha256
          if-no-files-found: error
