name: Build Android APK

on:
  push:
    branches: [ main, fix/export-stall-watchdog, feature/ai-v2 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android 36 SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Download VDSR AI model
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://huggingface.co/mlboydaisuke/vdsr-litert/resolve/main/vdsr_256_fp16.tflite" \
            --output app/src/main/assets/vdsr_256_fp16.tflite
          test "$(stat -c%s app/src/main/assets/vdsr_256_fp16.tflite)" -gt 1000000
          sha256sum app/src/main/assets/vdsr_256_fp16.tflite

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Video-Enhancer-Android-AI-V2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
